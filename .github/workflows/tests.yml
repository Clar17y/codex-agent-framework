name: Framework tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ripgrep --yes --no-progress
          # Chocolatey reports success when its feed times out and nothing is
          # installed; fall back to the upstream release build.
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            $name = 'ripgrep-15.2.0-x86_64-pc-windows-msvc'
            $zip = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
            Invoke-WebRequest "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/$name.zip" `
              -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
            Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
            Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP $name)
          }
      - name: Verify inventory dependency
        run: rg --version
      - name: Test installer and provider runner
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Check patch whitespace
        run: git show --format= --check HEAD
