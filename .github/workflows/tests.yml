name: Framework tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Verify inventory dependency
        run: rg --version
      - name: Test installer and provider runner
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Check patch whitespace
        run: git show --format= --check HEAD
